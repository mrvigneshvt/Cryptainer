server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---- compression ----
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml application/rss+xml application/manifest+json;

    # ---- security headers (good hygiene; also a small ranking signal) ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ---- caching ----
    # hashed build assets never change → cache hard
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # images / fonts → cache a while
    location ~* \.(png|svg|jpe?g|webp|avif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
    # html / xml / txt → always revalidate so deploys go live instantly
    location ~* \.(html|xml|txt)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # ---- routing: real files only, otherwise a real 404 (no soft-404s) ----
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
